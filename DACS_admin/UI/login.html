<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQizPro - Đăng nhập Quản trị viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f5f9;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .login-card-container {
            display: flex;
            height: 600px;
            width: 100%;
            max-width: 1000px;
            background-color: #ffffff;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        /* Cột bên trái - Hình ảnh học tập & Slogan */
        .left-panel {
            flex: 1.1;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f172a;
            padding: 40px;
            border-right: 1px solid #f1f5f9;
        }
        .left-content {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .left-panel-img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
            transition: transform 0.5s ease;
        }
        .left-panel-img:hover {
            transform: translateY(-5px);
        }
        .info-card {
            background: transparent;
            border: none;
            text-align: left;
        }
        .logo-badge {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25);
        }
        .info-card h1 {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        .info-card p {
            color: #475569;
            font-size: 14px;
            line-height: 1.6;
        }
        /* Cột bên phải - Form đăng nhập */
        .right-panel {
            flex: 1;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            z-index: 10;
        }
        .login-box {
            width: 100%;
            max-width: 380px;
        }
        .form-control {
            border-radius: 16px;
            padding: 16px 52px;
            font-size: 16px;
            border: 2px solid #f1f5f9;
            background-color: #f8fafc;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #0284c7;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
        }
        .input-group-icon {
            position: relative;
        }
        .input-group-icon i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #0284c7;
            font-size: 19px;
            transition: color 0.3s;
        }
        .form-control:focus + i {
            color: #0369a1;
        }
        .btn-login {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            font-size: 15px;
            border: none;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25);
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .alert {
            border-radius: 14px;
            font-size: 14px;
            border: none;
        }
        /* Mobile Responsive */
        @media (max-width: 991px) {
            body {
                background-color: #ffffff;
                padding: 0;
            }
            .login-card-container {
                height: 100vh;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }
            .left-panel {
                display: none;
            }
            .right-panel {
                flex: 1;
                background-color: #ffffff;
            }
            .login-box {
                background: #ffffff;
                padding: 20px;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

<div class="login-card-container">
    <!-- Cột trái: Hình ảnh giáo dục nghệ thuật & thông điệp dạng Card Minimalist -->
    <div class="left-panel">
        <div class="left-content">
            <!-- LINK ẢNH MẠNG TRỰC TIẾP: Bạn có thể thay đổi thuộc tính src bên dưới bằng bất kỳ URL ảnh mạng nào khác -->
            <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=1200&auto=format&fit=crop" class="left-panel-img" alt="Education Banner">
            
            <div class="info-card">
                <div class="logo-badge">Q</div>
                <h1 class="fw-bold">EduQizPro</h1>
                <p class="mb-0">Hệ thống quản trị nền tảng trực tuyến thông minh, hỗ trợ phản hồi dữ liệu thời gian thực và đo lường sự xuất sắc của học viên.</p>
            </div>
        </div>
    </div>

    <!-- Cột phải: Form đăng nhập -->
    <div class="right-panel">
        <div class="login-box">
            <div class="text-center mb-5 d-block d-lg-none">
                <h2 class="fw-bold" style="color: #6200EE;">EduQizPro</h2>
                <small class="text-muted">Quản trị viên hệ thống</small>
            </div>
            
            <h3 class="fw-bold mb-2 text-dark" style="font-size: 26px;">Chào mừng trở lại!</h3>
            <p class="text-muted mb-4 small">Đăng nhập tài khoản Admin để truy cập bảng điều khiển.</p>
            
            <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3 input-group-icon">
                    <input type="email" id="email" class="form-control" placeholder="Email quản trị" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                
                <div class="mb-4 input-group-icon">
                    <input type="password" id="password" class="form-control" placeholder="Mật khẩu bảo mật" required>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <button type="submit" id="btnLogin" class="btn btn-login w-100 mb-4">
                    <span id="btnText">ĐĂNG NHẬP HỆ THỐNG</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
            </form>
            
            <div class="text-center text-muted mt-5" style="font-size: 13px; letter-spacing: 1px;">
                — EDUQIZ EXCELLENCE —
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { auth, db } from "./firebase-init.js";
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // Kiểm tra xem user đã đăng nhập hay chưa
    onAuthStateChanged(auth, (user) => {
        if (user) {
            window.location.href = "Admin_home.html";
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMessage');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnLogin = document.getElementById('btnLogin');

        // Hiện hiệu ứng Loading
        errorDiv.classList.add('d-none');
        btnText.innerText = "ĐANG XỬ LÝ...";
        btnSpinner.classList.remove('d-none');
        btnLogin.disabled = true;

        try {
            // Đăng nhập bằng Firebase Authentication
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // Kiểm tra xem user có role "ADMIN" trong Firestore không
            const userDocRef = doc(db, "users", user.uid);
            const userDocSnap = await getDoc(userDocRef);

            if (userDocSnap.exists()) {
                const userData = userDocSnap.data();
                if (userData.role === "ADMIN" || userData.role === "admin") {
                    window.location.href = "Admin_home.html";
                } else {
                    throw new Error("Tài khoản không có quyền truy cập vào trang Admin!");
                }
            } else {
                throw new Error("Không tìm thấy thông tin người dùng trong hệ thống!");
            }
        } catch (error) {
            showError(error.message);
        }

        function showError(msg) {
            errorDiv.innerText = msg;
            errorDiv.classList.remove('d-none');
            btnText.innerText = "ĐĂNG NHẬP HỆ THỐNG";
            btnSpinner.classList.add('d-none');
            btnLogin.disabled = false;
        }
    });
</script>
</body>
</html>
